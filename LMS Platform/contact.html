<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary" aria-label="Main navigation">

      <a class="navbar-brand" href="index.html">LMS</a>

   <!-- Contact -->
  <main class="bg-body-tertiary flex-grow-1 py-5">
    <div class="container">
      <h1 class="h2 text-center mb-4">Contact Us</h1>
 
      <div id="formAlert" class="alert alert-success d-none" role="alert">Thank you! Your message has been sent.</div>
 
      <form id="contactForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your Name" required>
          <div class="invalid-feedback">Please enter your name.</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Your Email" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Your Message" required></textarea>
          <div class="invalid-feedback">Please enter a message.</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </main>

   <!-- Footer -->
  <footer class="bg-primary text-white text-center py-3">

 <script src="script.js" defer></script>
