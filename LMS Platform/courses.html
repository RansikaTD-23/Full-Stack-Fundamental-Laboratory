<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Welcome to the LMS Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">LMS</a>
      <ul class="navbar-nav flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#courses">Courses</a></li>
        <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <button id="darkToggle" class="btn btn-outline-light btn-sm">Dark Mode</button>
    </div>
  </nav>

  <!-- Popular Courses -->
<section id="courses" class="bg-body-tertiary text-center py-5">
  <div class="container">
    <h2 class="mb-4">Our Courses</h2>
    <div class="row g-4">

      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <img src="images\img4.jpg" class="card-img-top" alt="Web Development course" style="height: 220px; object-fit: cover;">
          <div class="card-body text-start">
            <h3 class="h5 card-title">Programming Basics</h3>
             <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                      data-title="Programming Basics" data-desc="Learn Python programming from scratch.">View Details</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <img src="images\img5.jpg" class="card-img-top" alt="Data Science course" style="height: 220px; object-fit: cover;">
          <div class="card-body text-start">
            <h3 class="h5 card-title">AI Fundamentals</h3>
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                      data-title="AI Fundamentals" data-desc="Understand the core ideas behind artificial intelligence and machine learning.">View Details</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm">
          <img src="images\img6.jpg" class="card-img-top" alt="Digital Marketing course" style="height: 220px; object-fit: cover;">
          <div class="card-body text-start">
            <h3 class="h5 card-title">UI Design</h3>
             <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal"
                      data-title="UI Design" data-desc="Design clean, user-friendly interfaces using modern design principles.">View Details</button>
        </div>
      </div>

    </div>
  </div>
</section>

 <!-- Course Details Modal -->
  <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="courseModalTitle">Course</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="courseModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

<!-- Footer -->
  <footer class="bg-primary text-white text-center py-3">

        <a href="#" class="text-white">Privacy Policy</a>
        <span class="mx-2">|</span>
        <a href="#" class="text-white">Terms of Use</a>
      </p>
    </div>
  </footer>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
